<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerb · Prototype versions</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15182B;--mute:#868BA0;--line:#E7E8EF;--accent:#D6318A;--soft:#FCE6F1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F6F9;font-family:'Figtree',system-ui,sans-serif;color:var(--ink);padding:24px}
  main{width:100%;max-width:440px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  p{color:var(--mute);margin:0 0 20px;font-size:15px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  a{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
  a:hover{border-color:var(--accent);transform:translateY(-1px)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a b{display:block;font-size:16px}
  a span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
  a i{font-style:normal;color:var(--accent);font-weight:800;font-size:18px}
</style>
</head>
<body>
<main>
  <h1>Prototype versions</h1>
  <p>Pick a version to open.</p>
  <ul>
    <li><a href="version1.html"><div><b>Version 1</b><span>version1.html</span></div><i>→</i></a></li>
    <li><a href="version2lyft.html"><div><b>Version 2 · Lyft - with presenter controls</b><span>version2lyft.html</span></div><i>→</i></a></li>
    <li><a href="version3lyft.html"><div><b>Version 3 · Lyft</b><span>version3lyft.html</span></div><i>→</i></a></li>
    <li><a href="version3pink.html"><div><b>Version 3 · Pink</b><span>version3pink.html</span></div><i>→</i></a></li>
    <li><a href="videoDemo.html"><div><b>Video Demo</b><span>videoDemo.html</span></div><i>→</i></a></li>

  </ul>
</main>
</body>
</html>
